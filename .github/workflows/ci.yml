name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require code-review evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: grep -Eq '(^|[[:space:]])/code-review([[:space:]]|$)' <<< "$PR_BODY"

      - name: Enforce source LOC cap
        if: github.event_name == 'pull_request'
        run: ./scripts/check-source-loc-cap.sh "${{ github.event.pull_request.base.sha }}"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build Zig ABI contracts
        run: |
          test "$(zig version)" = "$(tr -d '\\n' < .zigversion)"
          zig build test --build-file native/zig/build.zig
          zig build --build-file native/zig/build.zig -Dtarget=aarch64-linux-android35 -Doptimize=ReleaseSafe

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Build docs site
        run: ./scripts/build-docs.sh

      - name: Run OpenPhone checks
        run: ./scripts/check.sh

      - name: Check whitespace
        run: git diff --check
